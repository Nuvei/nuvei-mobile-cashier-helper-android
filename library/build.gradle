repositories {
    mavenCentral()
}

publishing {
    publications {
        sdkRelease(MavenPublication) {
            groupId = 'com.nuvei.mobile'
            artifactId = 'cashier-helper-sdk'
            version = library_version

            from components.findByName('release')
            artifact "$buildDir/outputs/aar/library-release.aar"

            pom.withXml {
                def dependenciesNode = asNode().appendNode('dependencies')
                configurations.implementation.allDependencies.each { dependency ->
                    def dependencyNode = dependenciesNode.appendNode('dependency')
                    dependencyNode.appendNode('groupId', dependency.group)
                    dependencyNode.appendNode('artifactId', dependency.name)
                    dependencyNode.appendNode('version', dependency.version)
                }
            }
        }
    }

    repositories {
        maven {
            name = 'LocalMaven'
            url = layout.buildDirectory.dir("repo")
        }
    }
}

dependencies {
//    implementation(name:'nuvei-paycards', ext:'aar')
    implementation(name:'nuvei-zxing-android-embedded', ext:'aar')
//    implementation 'com.journeyapps:zxing-android-embedded:4.2.0'
//    implementation 'cards.pay:paycardsrecognizer:1.1.0'
    implementation 'com.google.android.gms:play-services-wallet:18.1.3'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Was pulled in transitively by appcompat 1.0.0; appcompat 1.7.x no longer depends on it.
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation "androidx.core:core-ktx:1.15.0"
}
